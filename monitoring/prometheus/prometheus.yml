global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "node-exporter-pi"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "node-exporter-backup-server"
    static_configs:
      - targets: ["100.92.156.184:9100"]

  - job_name: "home-assistant"
    metrics_path: /api/prometheus
    bearer_token_file: /etc/prometheus/secrets/ha_token
    static_configs:
      - targets: ["10.10.50.180:8123"]
