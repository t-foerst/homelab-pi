global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "node-exporter-pi"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "node-exporter-backup-server"
    static_configs:
      - targets: ["backup-server.netbird.cloud:9100"]
